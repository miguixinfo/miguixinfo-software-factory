# Gate de backend (reutilizable). Lo llama el CI de cada proyecto.
# Formato (Spotless), tests unitarios y de integración (Testcontainers), reglas de arquitectura
# hexagonal (ArchUnit), cobertura mínima (JaCoCo) y deriva del contrato OpenAPI.
name: backend-ci

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: backend
      java-version:
        type: string
        default: "25"

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Formato, tests, arquitectura y cobertura
        run: ./mvnw -B -ntp verify

      - name: El contrato OpenAPI está actualizado
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain -- docs/api/openapi.json)" ]; then
            echo "::error::docs/api/openapi.json no coincide con la API. Ejecuta './mvnw verify' en backend y commitea el contrato."
            git --no-pager diff -- docs/api/openapi.json | head -100
            exit 1
          fi

      - name: Informe de cobertura
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {m+=$8; c+=$9} END {if (m+c>0) printf "### Cobertura de líneas del backend: %.1f%%\n", 100*c/(m+c)}' \
              target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-reports
          path: |
            ${{ inputs.working-directory }}/target/classes
            ${{ inputs.working-directory }}/target/test-classes
            ${{ inputs.working-directory }}/target/site/jacoco/jacoco.xml
          retention-days: 3
          if-no-files-found: ignore
